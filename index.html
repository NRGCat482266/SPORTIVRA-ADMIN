sor:pointer;font:inherit}button.primary{background:var(--accent);color:#132010;border-color:var(--accent);font-weight:800}button:disabled{opacity:.5;cursor:wait}button:hover:not(:disabled){filter:brightness(1.08)}input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:11px;color:var(--text);font:inherit;margin:5px 0 14px}input[type=checkbox]{width:auto;margin-right:8px}label{font-size:13px;color:var(--muted);display:block}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.hidden{display:none!important}.notice{padding:12px 16px;border-radius:10px;background:#194333;color:#dcfff0;border:1px solid #2a795d;margin:14px 0}.notice.error{background:#522633;color:#ffe8ed;border-color:#aa3b58}.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.item{padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--panel2);min-height:150px}.item .emoji{font-size:35px}.item strong{display:block;line-height:1.3;margin:7px 0}.tag{font-size:11px;border:1px solid var(--border);padding:3px 8px;border-radius:20px;display:inline-block;color:var(--muted)}.rare{color:#71b9ff}.epic{color:#cf91ff}.legendary{color:#ffd45b}.avatar{width:95px;height:95px;border-radius:50%;object-fit:cover;border:5px solid var(--accent);background:#263b52}.avatar.vip{border-color:#ffcf51;box-shadow:0 0 20px #ffd65b80}.badge{display:inline-block;border:1px solid var(--border);padding:7px 11px;border-radius:100px;margin:4px;background:var(--panel2)}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--border)}.chat{min-height:160px;max-height:430px;overflow:auto;padding:12px;background:var(--panel2);border-radius:12px;margin-bottom:12px}.bubble{margin:9px 0;padding:12px;border-radius:12px;max-width:90%;white-space:pre-wrap}.bubble.me{background:#315b42;margin-left:auto}.bubble.ai{background:#253 <script>
(function(){'use strict';
const defaults={density:'comfortable',font:'normal',motion:'on',contrast:'normal',sport:'football',notifications:'on',sounds:'off',odds:'decimal',timezone:'local',confirm:'on'};
function key(){try{return 'fz24.preferences.'+(typeof user!=='undefined'&&user?.id||'guest')+(location.pathname.includes('admin')?'.admin':'')}catch(e){return 'fz24.preferences.guest'}}
window.fz24ReadPrefs=function(){try{return {...defaults,...JSON.parse(localStorage.getItem(key())||'{}')}}catch(e){return {...defaults}}};
window.fz24ApplyPrefs=function(){const p=window.fz24ReadPrefs();document.body.classList.toggle('fz24-compact',p.density==='compact');document.body.classList.toggle('fz24-large',p.font==='large');document.body.classList.toggle('fz24-no-motion',p.motion==='off');document.body.classList.toggle('fz24-high-contrast',p.contrast==='high');};
window.fz24SettingsMarkup=function(){return `<div class="card"><h2>🎛️ Personalizacja SPORTIVRA 2.7</h2><p class="fz24-hint">Te dodatkowe preferencje zapisują się na tym urządzeniu. Nie zmieniają danych innych graczy.</p><div class="fz24-options">

<label>Rozmiar tekstu<select data-fz24="font"><option value="normal">Standardowy</option><option value="large">Duży</option></select></label>
<label>Animacje<select data-fz24="motion"><option value="on">Włączone</option><option value="off">Wyłączone</option></select></label>
<label>Kontrast<select data-fz24="contrast"><option value="normal">Standardowy</option><option value="high">Wysoki</option></select></label>
<label>Ulubiony sport<select data-fz24="sport"><option value="football">⚽ Piłka nożna</option><option value="volleyball">🏐 Siatkówka</option><option value="basketball">🏀 Koszykówka</option><option value="handball">🤾 Piłka ręczna</option><option value="esports">🎮 Esport</option><option value="f1">🏎️ Formuła 1</option></select></label>
<label>Powiadomienia wewnątrz strony<select data-fz24="notifications"><option value="on">Włączone</option><option value="off">Wyciszone (preferencja)</option></select></label>
<label>Dźwięki interfejsu<select data-fz24="sounds"><option value="off">Wyłączone</option><option value="on">Włączone, gdy obsługiwane</option></select></label>
<label>Format kursów<select data-fz24="odds"><option value="decimal">Dziesiętny</option><option value="fractional">Ułamkowy (preferencja)</option></select></label>
<label>Strefa czasowa<select data-fz24="timezone"><option value="local">Lokalna urządzenia</option><option value="utc">UTC (preferencja)</option></select></label>
<label>Potwierdzanie ważnych operacji<select data-fz24="confirm"><option value="on">Włączone</option><option value="off">Preferencja: wyłączone</option></select></label></div>
<div class="row" style="margin-top:16px"><button type="button" class="primary" id="fz24-save-prefs">💾 Zapisz preferencje</button><button type="button" id="fz24-reset-prefs">↩️ Przywróć domyślne</button></div><p class="fz24-hint">Niektóre opcje (np. dźwięki, format kursów i powiadomienia) zapisują preferencję, ale nie zastępują konfiguracji tych usług. Zabezpieczenia administratora zawsze pozostają aktywne.</p></div>`};
window.fz24BindSettings=function(){const p=window.fz24ReadPrefs();document.querySelectorAll('[data-fz24]').forEach(e=>{e.value=p[e.dataset.fz24]??defaults[e.dataset.fz24]});const save=document.getElementById('fz24-save-prefs');if(save)save.onclick=()=>{const n={...defaults};document.querySelectorAll('[data-fz24]').forEach(e=>{n[e.dataset.fz24]=e.value});try{localStorage.setItem(key(),JSON.stringify(n));window.fz24ApplyPrefs();if(typeof note==='function')note('Zapisano preferencje na tym urządzeniu.')}catch(e){if(typeof note==='function')note('Nie udało się zapisać preferencji: '+e.message,true)}};const reset=document.getElementById('fz24-reset-prefs');if(reset)reset.onclick=()=>{localStorage.removeItem(key());window.fz24ApplyPrefs();window.fz24BindSettings();if(typeof note==='function')note('Przywrócono ustawienia domyślne.')};};
document.addEventListener('DOMContentLoaded',window.fz24ApplyPrefs);
})();
</script>
</head><body><header><div class="logo">🛡️ SPORT<em>IVRA</em> <span class="pill">ADMIN 2.7</span></div><div class="row"><span id="who">Gość</span><button id="logout" class="hidden">Wyloguj</button></div></header><main><div class="hero"><h1>Centrum dowodzenia SPORTIVRA</h1><p>Użytkownicy • nagrody • VIP • odznaki • dekoracje • aktualizacje</p></div><section id="auth" class="card"><h2>🔐 Logowanie ADMIN</h2><label>E-mail<input id="email" type="email" autocomplete="email"></label><label>Hasło<input id="password" type="password" autocomplete="current-password"></label><div class="row"><button id="login" class="primary">Zaloguj</button><button id="signup" class="hidden">Rejestracja</button><button id="reset">Reset hasła</button></div></section><section id="app" class="hidden"><nav id="nav" class="nav"></nav><div id="view"></div></section><div id="notice" class="notice hidden" role="status"></div></main><footer>Dostęp tylko dla administratora zweryfikowanego przez bazę danych</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';
const URL_FZ=window.SPORTIVRA_CONFIG?.supabaseUrl || '';
const KEY_FZ=window.SPORTIVRA_CONFIG?.supabasePublishableKey || '';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,user=null,profile=null,active='Start',authInitError='';
const show=(id,yes)=>$(id)?.classList.toggle('hidden',!yes);
function note(s,error=false){const n=$('notice');n.textContent=String(s);n.className='notice'+(error?' error':'');n.scrollIntoView({block:'nearest',behavior:'smooth'})}
async function checked(p){const {data,error}=await p;if(error)throw error;return data}
async function rpc(fn,args={}){return checked(db.rpc(fn,args))}
async function authInit(){
 $('login').onclick=login;$('reset').onclick=resetPassword;if($('signup'))$('signup').onclick=signup;
 $('password').onkeydown=e=>{if(e.key==='Enter')login()};
 $('logout').onclick=async()=>{try{await checked(db.auth.signOut());user=null;profile=null;guest();note('Wylogowano.')}catch(e){note(e.message,true)}};
 if(!URL_FZ||!KEY_FZ){authInitError='Brak konfiguracji Supabase. Sprawdź plik sportivra-config.js w katalogu głównym.';note(authInitError,true);return}
 if(!window.supabase?.createClient){authInitError='Nie załadowano biblioteki Supabase. Sprawdź blokowanie skryptów.';note(authInitError,true);return}
 try{db=window.supabase.createClient(URL_FZ,KEY_FZ,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const s=await checked(db.auth.getSession());if(s.session?.user){user=s.session.user;await enter()}else guest()}catch(e){note('Inicjalizacja: '+e.message,true)}
}
function guest(){show('auth',true);show('app',false);show('logout',false);$('who').textContent='Gość'}
async function login(){if(!db)return note(authInitError||'Supabase jeszcze się nie załadował.',true);const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return note('Podaj e-mail i hasło.',true);const b=$('login');b.disabled=true;b.textContent='Logowanie...';try{const r=await checked(db.auth.signInWithPassword({email,password}));user=r.user;await enter()}catch(e){note('Logowanie: '+e.message,true)}finally{b.disabled=false;b.textContent='Zaloguj'}}
async function signup(){if(!db)return note(authInitError||'Supabase jeszcze się nie załadował.',true);const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return note('Wpisz e-mail i hasło min. 6 znaków.',true);const b=$('signup');b.disabled=true;try{const r=await checked(db.auth.signUp({email,password}));if(r.session){user=r.user;await enter()}else note('Rejestracja przyjęta. Sprawdź e-mail, jeśli potwierdzenie jest wymagane.')}catch(e){note('Rejestracja: '+e.message,true)}finally{b.disabled=false}}
async function resetPassword(){if(!db)return note(authInitError||'Supabase jeszcze się nie załadował.',true);const email=$('email').value.trim();if(!email)return note('Podaj e-mail.',true);try{await checked(db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));note('Jeżeli konto istnieje, otrzymasz wiadomość z instrukcją.')}catch(e){note(e.message,true)}}
async function enter(){try{profile=await checked(db.from('fz21_profiles').select('*').eq('id',user.id).single());await enterApp();show('auth',false);show('app',true);show('logout',true);$('who').textContent=profile.nickname||user.email;$('notice').classList.add('hidden')}catch(e){guest();note('Błąd profilu / SQL: '+e.message,true)}}
function tabs(pages,render){$('nav').innerHTML=pages.map(p=>`<button data-page="${esc(p)}" class="${p===active?'active':''}">${esc(p)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.page;render()})}
function action(button,fn){const label=button.textContent;button.disabled=true;button.textContent='Przetwarzanie...';Promise.resolve().then(fn).catch(e=>note(e.message||String(e),true)).finally(()=>{button.disabled=false;button.textContent=label})}
window.addEventListener('error',e=>{if(e.message&&e.message!=='Script error.')note('Błąd JavaScript: '+e.message,true)});
window.addEventListener('unhandledrejection',e=>{note('Błąd operacji: '+(e.reason?.message||String(e.reason)),true)});
document.addEventListener('DOMContentLoaded',authInit);



function fzArt(item){
 if(!item)return '<div class="fz-art">Brak dekoracji</div>';
 const rarity=['common','rare','epic','legendary'].includes(item.rarity)?item.rarity:'common';
 const icon=item.icon||'✨';
 return `<div class="fz-art" data-rarity="${rarity}" aria-label="Dekoracja: ${esc(item.name)}"><div class="fz-art-icon">${esc(icon)}</div><div class="fz-art-name">${esc(item.name)}</div><div class="fz-art-type">${esc(item.category)} · ${rarity}</div></div>`;
}

// SPORTIVRA 2.2: local graphical preview, no copyrighted player likenesses.
function fzPreview(item,owned=false,admin=false){
 if(!item)return;
 document.getElementById('fzPreviewOverlay')?.remove();
 const palette={common:['#1a4153','#65b9cf'],rare:['#173b73','#52b8ff'],epic:['#49256f','#b277f5'],legendary:['#69451a','#ffd166']};
 const colors=palette[item.rarity]||palette.common;
 const container=document.createElement('div');container.id='fzPreviewOverlay';container.className='fz-overlay';
 const card=document.createElement('div');card.className='fz-modal';card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-label','Podgląd dekoracji');
 const isPlayer=item.category==='pakiet-pilkarza';
 card.innerHTML=`<button type="button" class="fz-close" id="fzClose" aria-label="Zamknij">✕</button><h2>👀 Podgląd dekoracji</h2><div class="fz-preview" style="--preview1:${colors[0]};--preview2:${colors[1]}"><div class="fz-stars">✦ ✧ ✦</div><div class="fz-illustration">${isPlayer?'⚽':esc(item.icon||'✨')}</div><div class="fz-demo-player">${isPlayer?'⚽ ZAWODNIK':'⚽ SPORTIVRA'}</div><div class="fz-demo-name">${esc(item.name)}</div><div class="fz-demo-rarity">${esc(item.rarity||'common').toUpperCase()}</div></div><p><b>${esc(item.name)}</b></p><p class="muted">Kategoria: ${esc(item.category)} • Rzadkość: ${esc(item.rarity)} • Cena: ${Number(item.price)||0} FZ Points</p><p class="muted">Wizualizacja poglądowa: motyw, kolory i układ karty. Nie jest to zdjęcie prawdziwego piłkarza.</p><div class="row"><button id="fzCloseBottom">Zamknij</button>${!admin?`<button id="fzPreviewBuy" class="primary" ${owned?'disabled':''}>${owned?'Już posiadasz':'Kup za '+Number(item.price)+' FZ Points'}</button>`:''}</div>`;
 container.append(card);document.body.append(container);
 const close=()=>{container.remove();document.removeEventListener('keydown',escClose)};
 const escClose=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',escClose);
 container.addEventListener('click',e=>{if(e.target===container)close()});
 card.querySelector('#fzClose').onclick=close;card.querySelector('#fzCloseBottom').onclick=close;
 const buy=card.querySelector('#fzPreviewBuy');if(buy&&!owned)buy.onclick=()=>{close();const btn=document.querySelector(`[data-buy="${item.id}"]`);if(btn)btn.click();else note('Przejdź do sklepu, aby kupić tę dekorację.')};
 card.querySelector('#fzClose').focus();
}
async function fzLoadAllDecorations(){
 const result=[];const chunk=500;
 for(let offset=0;offset<15000;offset+=chunk){const rows=await checked(db.from('fz21_decorations').select('*').order('id').range(offset,offset+chunk-1));result.push(...rows);if(rows.length<chunk)break}
 return result;
}

</script><script>
'use strict';
const ADMIN_PAGES=['Pulpit','Gracze','Nagrody','VIP i dekoracje','Moderacja','Odznaki','Ogłoszenia','Update Center','Dziennik','Ustawienia'];
let players=[],decor=[],badgeCatalog=[],events=[];
async function enterApp(){if(!await rpc('fz21_is_admin'))throw Error('Brak uprawnień ADMIN dla tego konta.');await adminRefresh();renderAdmin()}
async function adminRefresh(){const res=await Promise.all([checked(db.from('fz21_profiles').select('id,nickname,coins,points,vip_until,created_at').order('created_at',{ascending:false}).limit(200)),fzLoadAllDecorations(),checked(db.from('fz21_badges').select('id,name,icon').order('id'))]);[players,decor,badgeCatalog]=res}
